<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>研读 · 个人知识库</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="wordbook.css">
</head>
<body>
  <main class="wordbook-shell">
    <header class="wordbook-head">
      <div class="wordbook-title">
        <span class="logo" aria-hidden="true">研</span>
        <div><h1>个人知识库</h1><p>收藏的生词、译文和原句</p></div>
      </div>
      <div class="actions"><button class="secondary" id="exportCsv">导出 CSV</button><button class="quiet" id="settingsButton">模型与提示词</button></div>
    </header>
    <section class="tools" aria-label="搜索词条">
      <input class="search-input" id="search" type="search" aria-label="搜索词条" placeholder="搜索原词、译文、上下文或来源">
      <strong id="summary" role="status">0 个词条</strong>
    </section>
    <section id="list" aria-label="词条"></section>
    <section id="empty" hidden>
      <h2 id="emptyTitle">还没有收藏生词或术语</h2>
      <p id="emptyHelp">划词翻译后，点击卡片里的「收藏」。</p>
    </section>
  </main>
  <template id="entryTemplate">
    <article class="entry">
      <div class="entry-head"><div><h2 class="source"></h2><time></time></div><button class="delete quiet" aria-label="删除词条">删除</button></div>
      <div class="translation"></div>
      <blockquote class="context"></blockquote>
      <a class="source-link" target="_blank" rel="noreferrer"></a>
    </article>
  </template>
  <script src="wordbook.js"></script>
</body>
</html>
