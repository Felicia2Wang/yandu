<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>插件内置 PDF 阅读器</title><link rel="stylesheet" href="content.css"><link rel="stylesheet" href="pdf-viewer.css"></head>
<body><header class="pdf-toolbar"><div class="pdf-brand"><span>读</span><strong>PDF 阅读器</strong></div><label class="file-button">打开本地 PDF<input id="fileInput" type="file" accept="application/pdf,.pdf"></label><div class="pdf-controls"><button id="pdfFocus" aria-pressed="false" disabled>专注模式</button><button id="fitWidth">适合宽度</button><button id="zoomOut" title="缩小">−</button><output id="zoomLabel">100%</output><button id="zoomIn" title="放大">＋</button><button id="settingsButton">设置</button></div></header>
<main id="viewer"><section id="welcome"><div class="welcome-mark">PDF</div><h1>在这里阅读与划词翻译</h1><p>打开本地论文，选中文字后点击“译”。PDF 文件在浏览器本地读取。</p><label class="file-button large">选择 PDF<input type="file" accept="application/pdf,.pdf" data-picker></label><small>若从 Chrome 的本地 PDF 页面进入，请先在扩展详情中开启“允许访问文件网址”。</small></section><div id="pages"></div></main>
<div id="progress" hidden><span></span><em>正在解析 PDF…</em></div>
<script type="module" src="pdf-viewer.mjs"></script><script src="content.js"></script></body></html>
