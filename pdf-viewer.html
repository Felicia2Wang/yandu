<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>研读 · PDF 阅读器</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="pdf-viewer.css">
  <link rel="stylesheet" href="content.css">
</head>
<body>
  <header class="pdf-toolbar">
    <div class="pdf-brand"><span class="logo" aria-hidden="true">研</span><strong>研读 PDF</strong></div>
    <label class="file-button secondary">打开本地 PDF<input id="fileInput" type="file" accept="application/pdf,.pdf"></label>
    <div class="pdf-controls">
      <button class="quiet" id="pdfFocus" aria-pressed="false" disabled>专注模式</button>
      <button class="quiet" id="fitWidth">适合宽度</button>
      <div class="zoom-group" aria-label="PDF 缩放">
        <button class="quiet" id="zoomOut" aria-label="缩小">−</button>
        <output id="zoomLabel">100%</output>
        <button class="quiet" id="zoomIn" aria-label="放大">+</button>
      </div>
      <button class="quiet" id="settingsButton">设置</button>
    </div>
  </header>
  <main id="viewer">
    <section id="welcome">
      <h1>打开一份本地 PDF</h1>
      <p>在页上选中文字，即可划词翻译或收藏生词。</p>
      <label class="file-button primary">选择 PDF<input type="file" accept="application/pdf,.pdf"></label>
    </section>
    <div id="pages"></div>
  </main>
  <div id="progress" role="status" hidden><span></span><em>正在解析 PDF…</em></div>
  <script type="module" src="pdf-viewer.mjs"></script>
  <script src="content.js"></script>
</body>
</html>
